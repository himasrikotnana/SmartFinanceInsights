<!DOCTYPE html>
<html>
<head>
    <title>AI Insights</title>

    <style>
        body{
            background:#f4f6f9;
            font-family:Arial;
            padding:40px;
        }

        .container{
            max-width:800px;
            margin:auto;
        }

        .card{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:15px;
            box-shadow:0 0 10px lightgray;
        }

        h1{
            color:#0d2b7e;
        }
    </style>
</head>
<body>
{% include 'sidebar.html' %}
<div class="container">

    <h1>AI Financial Insights</h1>

    {% for tip in insights %}
        <div class="card">
            {{ tip }}
        </div>
    {% endfor %}

</div>

</body>
</html>
