<!DOCTYPE html>
<html>
<head>
    <title>Budget Planning</title>
    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:0;
        }

        .container{
            width:500px;
            margin:80px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 10px lightgray;
        }

        h1{
            color:#0d2b7e;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#0d2b7e;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        .current{
            margin-top:20px;
            font-size:22px;
            color:green;
        }
    </style>
</head>
<body>
{% include 'sidebar.html' %}
<div class="container">

    <h1>Budget Planning</h1>

    <form method="POST">

        <label>Monthly Budget</label>

        <input
            type="number"
            name="budget"
            placeholder="Enter Budget"
            required
        >

        <button type="submit">
            Save Budget
        </button>

    </form>

    {% if budget %}
        <div class="current">
            Current Budget : ₹{{ budget['budget_amount'] }}
        </div>
    {% endif %}

</div>

</body>
</html>
